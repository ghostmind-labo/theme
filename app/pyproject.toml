[project]
name = "theme"
version = "0.3.0"
description = "Recolour Ghostty, herdr and Helix in one command, with WCAG contrast enforcement."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
theme = "theme.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["theme"]
